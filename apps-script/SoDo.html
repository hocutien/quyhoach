<!DOCTYPE html>
<html lang="vi"><head><base target="_top"><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600&display=swap">
<style>
/* Bố cục: thanh lọc trên, sơ đồ lớn bên trái, bảng hồ sơ bên phải (xuống dưới trên điện thoại). Màu nhóm theo quy ước màu bản đồ quy hoạch. */
:root{
  --bg:#f5f6f3; --surface:#ffffff; --fg:#1d2420; --muted:#5d6862; --line:#d5dad5; --accent:#7b4fa6;
  --qg:#c0392b; --tqh:#2f5d9e; --tda:#167584; --kkt:#7b4fa6; --dtk:#c56a12; --xa:#3f7f34; --sdd:#8f7a10;
  --e-cuthe:#69736d; --e-ketnoi:#c0392b; --e-vb:#167584; --hl:#e8b400;
  --font-display:"Lexend","Be Vietnam Pro",system-ui,sans-serif;
  --font-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141816; --surface:#1d2320; --fg:#e7ece8; --muted:#9aa59f; --line:#323b36; --accent:#b48ae0;
  --qg:#ef7a6c; --tqh:#7fa7e6; --tda:#5ec2d1; --kkt:#b48ae0; --dtk:#f0a35a; --xa:#86c879; --sdd:#d6c15a;
  --e-cuthe:#8d9892; --e-ketnoi:#ef7a6c; --e-vb:#5ec2d1; --hl:#ffd54a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141816; --surface:#1d2320; --fg:#e7ece8; --muted:#9aa59f; --line:#323b36; --accent:#b48ae0;
  --qg:#ef7a6c; --tqh:#7fa7e6; --tda:#5ec2d1; --kkt:#b48ae0; --dtk:#f0a35a; --xa:#86c879; --sdd:#d6c15a;
  --e-cuthe:#8d9892; --e-ketnoi:#ef7a6c; --e-vb:#5ec2d1; --hl:#ffd54a; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;box-sizing:border-box}
*{box-sizing:border-box}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin-bottom:10px}
h1{font-family:var(--font-display);font-weight:600;font-size:1.35rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);
  border-radius:999px;padding:4px 10px;font:inherit;font-size:.82rem;cursor:pointer}
.chip[aria-pressed="false"]{opacity:.45}
.chip:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sw{width:18px;height:0;border-top:2px solid currentColor;display:inline-block}
.sw.dash{border-top-style:dashed}.sw.dot{border-top-style:dotted;border-top-width:3px}
#q{flex:1 1 200px;min-width:0;max-width:320px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 10px;font:inherit}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:5px 10px;font:inherit;font-size:.82rem;cursor:pointer}
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;height:calc(100% - 118px);min-height:520px}
#cy{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:520px;height:100%;width:100%}
aside{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:auto;min-width:0;height:100%}
aside h2{font-family:var(--font-display);font-weight:600;font-size:1.05rem;margin:0 0 4px;text-wrap:balance}
.grp{display:inline-block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-bottom:6px}
.path{font-size:.76rem;color:var(--muted);word-break:break-word;background:var(--bg);border-radius:6px;padding:6px 8px;margin:8px 0;cursor:copy}
.stats{display:flex;gap:16px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--fg);font-size:1rem}
h3{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;font-weight:600}
.rels{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.rels button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:baseline;font-size:.86rem;padding:3px 0}
.rels button:hover .rn{text-decoration:underline}
.rels .rt{font-size:.7rem;color:var(--muted);white-space:nowrap;min-width:92px}
.rels .rl{color:var(--muted);font-size:.78rem}
.docs{list-style:none;padding:0;margin:0}
.docs li{padding:7px 0;border-top:1px solid var(--line);font-size:.83rem;display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px}
.docs .dt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.78rem}
.docs .tag{display:inline-block;font-size:.68rem;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-right:4px;color:var(--muted)}
.docs .sb{display:block;color:var(--muted);font-size:.72rem}
.hint{color:var(--muted);font-size:.86rem}
.hint ol{padding-left:18px;margin:6px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.78rem;color:var(--muted);margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
@media (max-width:820px){
  .main{grid-template-columns:1fr;height:auto}
  #cy{height:62vh;min-height:420px}
  aside{height:auto;max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>

<header>
  <h1>Sơ đồ quan hệ quy hoạch</h1>
  <span class="sub" id="meta"></span>
</header>
<div class="bar" role="toolbar" aria-label="Lọc quan hệ">
  <button class="chip" id="f-cuthe" aria-pressed="true" style="color:var(--e-cuthe)"><span class="sw"></span><span style="color:var(--fg)">Cụ thể hóa / nằm trong</span></button>
  <button class="chip" id="f-ketnoi" aria-pressed="true" style="color:var(--e-ketnoi)"><span class="sw dash"></span><span style="color:var(--fg)">Kết nối giao thông</span></button>
  <button class="chip" id="f-vb" aria-pressed="true" style="color:var(--e-vb)"><span class="sw dot"></span><span style="color:var(--fg)">Văn bản chung</span></button>
  <input id="q" type="search" placeholder="Tìm dự án hoặc số văn bản (vd: 5156, D3A)…" aria-label="Tìm">
  <button class="btn" id="fit">Xem toàn bộ</button>
</div>
<div class="main">
  <div id="cy" aria-label="Sơ đồ quan hệ các dự án"></div>
  <aside id="panel" aria-live="polite"></aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script>
const PAYLOAD=<?!= payload ?>;
const NODES=PAYLOAD.nodes.map(n=>Object.assign(n,{g:n.group}));
const UPDATED=new Date().toISOString().slice(0,10);
const GROUPS={
  "Quốc gia – ngành":{label:"1. QUỐC GIA – NGÀNH",c:"--qg"},
  "Tỉnh – quy hoạch, chính sách":{label:"2. TỈNH – quy hoạch, chính sách",c:"--tqh"},
  "Tỉnh – dự án":{label:"2. TỈNH – dự án",c:"--tda"},
  "QH chung xã":{label:"6. QH CHUNG XÃ (sau sáp nhập)",c:"--xa"},
  "KKT Định An":{label:"3. KKT ĐỊNH AN",c:"--kkt"},
  "Đô thị Duyên Hải":{label:"Đô thị Duyên Hải",c:"--kkt",parent:"KKT Định An"},
  "KCN Ngũ Lạc":{label:"KCN Ngũ Lạc",c:"--kkt",parent:"KKT Định An"},
  "Đô thị ngoài KKT":{label:"4. ĐÔ THỊ NGOÀI KKT",c:"--dtk"},
  "TP Trà Vinh":{label:"TP Trà Vinh",c:"--dtk",parent:"Đô thị ngoài KKT"},
  "Sử dụng đất":{label:"5. SỬ DỤNG ĐẤT (QHSDĐ – KHSDĐ)",c:"--sdd"},
  "Chưa xếp":{label:"CHƯA XẾP – thêm vị trí trong tab SD_DUAN",c:"--muted"}
};
NODES.forEach(n=>{ if(!GROUPS[n.g]) GROUPS[n.g]={label:n.g,c:"--muted"}; });
const WATCH=new Set(NODES.filter(n=>n.watch).map(n=>n.id));
const EDGES=PAYLOAD.edges.map(e=>[e.s,e.t,e.k,e.l]);
const TYPE_LABEL={cuthe:"Cụ thể hóa",ketnoi:"Kết nối GT",vb:"Văn bản chung"};
const byId=Object.fromEntries(NODES.map(n=>[n.id,n]));
const fmt=d=>d?d.split("-").reverse().join("."):"";
const now=new Date(UPDATED);
NODES.forEach(n=>{
  n.docs.forEach(d=>{ if(!d.d){const m=(d.s||"").match(/(\d{2})\.(\d{2})\.(\d{4})/); if(m) d.d=`${m[3]}-${m[2]}-${m[1]}`;} });
  n.docs.forEach(d=>{d.y=d.d?d.d.slice(0,4):((d.s||"").match(/(?:^|\/)(\d{4})(?:\/|$)/)||[])[1]||"Khác"});
  n.docs.sort((a,b)=>b.y.localeCompare(a.y)||((b.d?1:0)-(a.d?1:0))||(b.d||"").localeCompare(a.d||"")||a.n.localeCompare(b.n,"vi",{numeric:true}));
  n.latest=n.docs.find(d=>d.d)?.d||"";
  n.recent=n.latest && (now-new Date(n.latest))/864e5<=14;
});
const total=NODES.reduce((s,n)=>s+n.docs.length,0);
document.getElementById("meta").textContent=`${NODES.length} dự án · ${total} văn bản · ${EDGES.length} quan hệ · Mục lục ${(PAYLOAD.updated||"").split("|")[0].replace("Cập nhật:","quét lúc").trim()}`;

function v(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim()}
function nodeLabel(n){
  const tail=[`${n.docs.length} VB`]; if(n.latest) tail.push("mới nhất "+fmt(n.latest));
  return (WATCH.has(n.id)?"★ ":"")+n.label+"\n"+tail.join(" · ");
}
const els=[];
const gid=k=>"G_"+Object.keys(GROUPS).indexOf(k);
const usedG=new Set(NODES.map(n=>n.g)); Object.entries(GROUPS).forEach(([k,g])=>{if(usedG.has(k)&&g.parent) usedG.add(g.parent)});
Object.entries(GROUPS).filter(([k])=>usedG.has(k)).forEach(([id,g])=>els.push({data:{id:gid(id),label:g.label,parent:g.parent?gid(g.parent):undefined,g:id},classes:"group"+(g.parent?" subgroup":"")}));
NODES.forEach(n=>els.push({data:{id:n.id,label:nodeLabel(n),parent:gid(n.g),g:n.g},position:{x:n.x,y:n.y},classes:(n.recent?"recent ":"")+(WATCH.has(n.id)?"watch":"")}));
EDGES.forEach(([s,t,k,l],i)=>els.push({data:{id:"e"+i,source:s,target:t,k,l},classes:k}));

function styles(){
  const col=g=>v(GROUPS[g].c);
  const st=[
   {selector:"node",style:{"shape":"round-rectangle","width":210,"height":58,"background-color":v("--surface"),"border-width":1.5,
     "label":"data(label)","text-wrap":"wrap","text-max-width":196,"font-family":"Be Vietnam Pro, system-ui, sans-serif","font-size":12,
     "color":v("--fg"),"text-valign":"center","text-halign":"center","line-height":1.25}},
   {selector:"node.watch",style:{"border-width":3}},
   {selector:"node.recent",style:{"background-color":v("--bg")}},
   {selector:"node.group",style:{"shape":"round-rectangle","background-opacity":.07,"border-width":1,"border-style":"dashed","padding":18,
     "label":"data(label)","text-valign":"top","text-halign":"center","text-margin-y":-4,"font-family":"Lexend, Be Vietnam Pro, sans-serif","font-size":13,"font-weight":600,"text-wrap":"none"}},
   {selector:"node.subgroup",style:{"background-opacity":.05,"font-size":11,"padding":12}},
   {selector:"edge",style:{"curve-style":"bezier","width":1.6,"target-arrow-shape":"triangle","arrow-scale":.9,"opacity":.85,
     "font-size":9,"color":v("--muted"),"text-background-color":v("--surface"),"text-background-opacity":.9,"text-background-padding":2,"text-rotation":"autorotate"}},
   {selector:"edge.cuthe",style:{"line-color":v("--e-cuthe"),"target-arrow-color":v("--e-cuthe")}},
   {selector:"edge.ketnoi",style:{"line-color":v("--e-ketnoi"),"target-arrow-color":v("--e-ketnoi"),"line-style":"dashed","width":2.2,"target-arrow-shape":"none"}},
   {selector:"edge.vb",style:{"line-color":v("--e-vb"),"target-arrow-color":v("--e-vb"),"line-style":"dotted","width":2.2}},
   {selector:".faded",style:{"opacity":.12}},
   {selector:"edge.on",style:{"label":"data(l)","opacity":1,"width":2.6,"z-index":10}},
   {selector:"node:selected, node.sel",style:{"border-color":v("--hl"),"border-width":4}},
   {selector:".hidden",style:{"display":"none"}},
   {selector:"node.match",style:{"border-color":v("--hl"),"border-width":4}}
  ];
  Object.keys(GROUPS).forEach((g,i)=>{
    st.push({selector:`node.gc${i}`,style:{"border-color":col(g)}});
    st.push({selector:`node.group.gc${i}`,style:{"background-color":col(g),"border-color":col(g),"color":col(g)}});
  });
  return st;
}
els.forEach(e=>{ if(e.data.g!==undefined) e.classes=(e.classes||"")+" gc"+Object.keys(GROUPS).indexOf(e.data.g); });
const cy=cytoscape({container:document.getElementById("cy"),elements:els,layout:{name:"preset",padding:30},style:styles(),
  minZoom:.15,maxZoom:2.5,wheelSensitivity:.25,autoungrabify:false,boxSelectionEnabled:false});
cy.fit(undefined,30);
const mq=window.matchMedia("(prefers-color-scheme: dark)");
const restyle=()=>cy.style(styles());
mq.addEventListener?.("change",restyle);
new MutationObserver(restyle).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

const panel=document.getElementById("panel");
function intro(){
  panel.innerHTML=`<h2>Cách xem</h2><div class="hint"><ol>
  <li>Bấm một ô để xem các văn bản trong thư mục và những dự án liên quan.</li>
  <li>Dùng các nút lọc phía trên để chỉ hiện một loại quan hệ.</li>
  <li>Kéo để di chuyển, chụm hoặc cuộn để phóng to.</li></ol>
  <p>Muốn thêm quan hệ hoặc đổi vị trí ô: sửa tab SD_QUANHE / SD_DUAN trong Mục lục rồi tải lại trang.</p><p>Viền đậm và dấu ★ là dự án theo dõi hằng ngày. Ô nền xám có văn bản mới trong 14 ngày qua.</p></div>
  <h3>Màu nhóm</h3><div class="legend">${Object.entries(GROUPS).filter(([k,g])=>!g.parent).map(([k,g])=>`<span><i style="background:var(${g.c})"></i>${g.label.replace(/^\d\.\s*/,"")}</span>`).join("")}</div>
  <h3>Văn bản mới nhất toàn kho</h3><ul class="docs">${NODES.flatMap(n=>n.docs.filter(d=>d.d).map(d=>({...d,node:n}))).sort((a,b)=>b.d.localeCompare(a.d)).slice(0,8)
   .map(d=>`<li><span class="dt">${fmt(d.d)}</span><span><button class="jump" data-id="${d.node.id}" style="all:unset;cursor:pointer;color:var(${GROUPS[d.node.g].c});font-size:.74rem;font-weight:600">${esc(d.node.label)}</button><br>${docName(d.n)}</span></li>`).join("")}</ul>`;
  panel.querySelectorAll(".jump").forEach(b=>b.onclick=()=>select(b.dataset.id,true));
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function docName(n){
  let s=esc(n).replace(/^\d+\.\s*\d{2}\.\d{2}\.\d{4}\s*/,"");
  return s.replace(/^\[([^\]]+)\]\s*/,(m,t)=>`<span class="tag">${t}</span>`);
}
function select(id,center){
  const n=byId[id]; if(!n) return;
  cy.elements().removeClass("faded on sel");
  const node=cy.getElementById(id);
  const nb=node.closedNeighborhood();
  cy.nodes().not(".group").not(nb).addClass("faded");
  cy.edges().not(nb.edges()).addClass("faded");
  nb.edges().addClass("on"); node.addClass("sel");
  if(center) cy.animate({center:{eles:node},zoom:Math.max(cy.zoom(),.9)},{duration:300});
  const rels=node.connectedEdges().map(e=>{const o=e.source().id()===id?e.target():e.source();
    return {id:o.id(),k:e.data("k"),l:e.data("l"),dir:e.source().id()===id?"→":"←"}});
  const g=GROUPS[n.g];
  const groups={};
  n.docs.forEach(d=>{(groups[d.y]=groups[d.y]||[]).push(d)});
  panel.innerHTML=`<span class="grp" style="color:var(${g.c})">${esc(g.parent?GROUPS[g.parent].label+" › "+g.label:g.label)}</span>
   <h2>${esc(n.label)}${WATCH.has(id)?" ★":""}</h2>
   <div class="stats"><span><b>${n.docs.length}</b> văn bản</span>${n.latest?`<span>mới nhất <b>${fmt(n.latest)}</b></span>`:""}</div>
   <div class="path" id="path" title="Bấm để chép đường dẫn">QUY HOACH\\${esc(n.path.replace(/\//g,"\\"))}</div>${n.url?`<p style="margin:0 0 4px"><a class="btn" href="${n.url}" target="_blank" rel="noopener">Mở thư mục trên Drive</a></p>`:""}${n.missing?`<p class="hint">Không thấy thư mục này trong Mục lục – kiểm tra cột Thư mục ở tab SD_DUAN.</p>`:""}
   <h3>Liên quan (${rels.length})</h3>
   ${rels.length?`<ul class="rels">${rels.map(r=>`<li><button data-id="${r.id}"><span class="rt">${r.dir} ${TYPE_LABEL[r.k]}</span><span><span class="rn">${esc(byId[r.id].label)}</span><br><span class="rl">${esc(r.l)}</span></span></button></li>`).join("")}</ul>`:`<p class="hint">Chưa ghi nhận quan hệ với dự án khác.</p>`}
   <h3>Văn bản</h3>
   ${Object.keys(groups).sort((a,b)=>a==="Khác"?1:b==="Khác"?-1:b.localeCompare(a)).map(y=>`<h3 style="margin-top:10px">${y}</h3><ul class="docs">${groups[y].map(d=>`<li><span class="dt">${fmt(d.d)}</span><span>${d.url?`<a href="${d.url}" target="_blank" rel="noopener" style="color:inherit">${docName(d.n)}</a>`:docName(d.n)}${d.s&&!/^\d{4}$/.test(d.s)?`<span class="sb">${esc(d.s)}</span>`:""}</span></li>`).join("")}</ul>`).join("")||'<p class="hint">Thư mục trống.</p>'}
   <p style="margin-top:14px"><button class="btn" id="back">Bỏ chọn</button></p>`;
  panel.querySelectorAll(".rels button").forEach(b=>b.onclick=()=>select(b.dataset.id,true));
  document.getElementById("back").onclick=clear;
  const p=document.getElementById("path");
  p.onclick=()=>{navigator.clipboard?.writeText(p.textContent).then(()=>{p.textContent="Đã chép đường dẫn"; setTimeout(()=>p.textContent="QUY HOACH\\"+n.path.replace(/\//g,"\\"),1200)}).catch(()=>{const r=document.createRange();r.selectNodeContents(p);getSelection().removeAllRanges();getSelection().addRange(r)})};
  panel.scrollTop=0;
}
function clear(){cy.elements().removeClass("faded on sel match"); intro();}
cy.on("tap","node",e=>{if(!e.target.hasClass("group")) select(e.target.id(),false)});
cy.on("tap",e=>{if(e.target===cy) clear()});

const filt={cuthe:true,ketnoi:true,vb:true};
[["f-cuthe","cuthe"],["f-ketnoi","ketnoi"],["f-vb","vb"]].forEach(([bid,k])=>{
  const b=document.getElementById(bid);
  b.onclick=()=>{filt[k]=!filt[k]; b.setAttribute("aria-pressed",filt[k]); cy.edges("."+k).toggleClass("hidden",!filt[k]);};
});
document.getElementById("fit").onclick=()=>cy.animate({fit:{padding:30}},{duration:300});
const q=document.getElementById("q");
q.oninput=()=>{
  const s=q.value.trim().toLowerCase(); cy.nodes().removeClass("match");
  if(!s){return}
  const hits=NODES.filter(n=>n.label.toLowerCase().includes(s)||n.docs.some(d=>d.n.toLowerCase().includes(s)));
  hits.forEach(n=>cy.getElementById(n.id).addClass("match"));
  if(hits.length===1) select(hits[0].id,true);
  else if(hits.length) cy.animate({fit:{eles:cy.collection(hits.map(n=>cy.getElementById(n.id))),padding:60}},{duration:300});
};
intro();
</script>

</body></html>
